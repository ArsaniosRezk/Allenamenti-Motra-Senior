<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Gestione allenamenti, formazioni e pagelle della squadra." />
  <!-- Il colore e' lo stesso per tutte le squadre (TEMA_PREDEFINITO in
       utils.js): se lo cambi, cambialo anche li' e nei manifest. -->
  <meta name="theme-color" content="#1f2937" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Statistiche</title>

  <link rel="icon" type="image/svg+xml" href="immagini/favicon.svg" />
  <link rel="apple-touch-icon" href="immagini/favicon.svg" />
  <!-- Manifest neutro di proposito: e' applicaIdentitaSquadra() a metterci
       quello della squadra risolta. Cablando qui una delle due squadre, il
       sito dell'altra scaricava comunque prima il manifest sbagliato. -->
  <link rel="manifest" href="manifest.json" />

  <link rel="preconnect" href="https://www.gstatic.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Inter stava in un @import dentro style.css, ma dopo una regola:
       per le specifiche CSS l'@import in quella posizione viene ignorato
       e il font non e' mai stato caricato. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="colors.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="loading">
  <!-- Intestazione comune -->
  <div id="intestazione">
    <h2 id="titolo-pagina">STATISTICHE</h2>
  </div>

  <!-- Mostrato se la squadra richiesta e' archiviata, vuota o inesistente -->
  <div id="avviso-squadra" class="avviso-squadra hidden"></div>

  <!-- Skeleton di caricamento (visibile solo con body.loading) -->
  <div id="skeleton-container">
    <div class="skeleton skeleton-text title"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>

  <!-- ============ Pagina 1: Statistiche ============ -->
  <div id="page-stats" class="page-container">
    <div id="statisticheAllenamentiContainer"></div>
    <div id="statistichePartiteContainer"></div>
  </div>

  <!-- ============ Pagina 2: Cronologia ============ -->
  <div id="page-storico" class="page-container hidden">
    <div id="storicoContainer"></div>
  </div>

  <!-- ============ Pagina 3: Partita ============ -->
  <div id="page-partita" class="page-container hidden">
    <div class="flex-control-row">
      <label for="dataPartita">Data</label>
      <input type="date" id="dataPartita" name="dataPartita" required />
    </div>

    <div class="flex-control-row">
      <label for="moduloFormazione">Modulo</label>
      <!-- Le opzioni le genera partita_spa.js dalla mappa `moduli`:
           una lista sola, non due da tenere allineate. -->
      <select id="moduloFormazione"></select>
    </div>

    <!-- Mostrato al posto del campo finche' non viene scelta una data -->
    <div class="stato-attesa">
      <i class="fas fa-calendar-day"></i>
      <span>Scegli una data per iniziare</span>
    </div>

    <!-- Campo e bottoni di azione vengono generati da partita_spa.js -->
    <div id="campo"></div>

    <h3 id="panchina-title">Panchina</h3>
    <div id="div-panchina">
      <div class="riga-uno">
        <select id="p1"></select>
        <select id="p2"></select>
        <select id="p3"></select>
        <select id="p4"></select>
        <select id="p5"></select>
      </div>
      <div class="riga-due">
        <select id="p6"></select>
        <select id="p7"></select>
        <select id="p8"></select>
        <select id="p9"></select>
        <select id="p10"></select>
      </div>
    </div>

    <div id="votiContainer"></div>

    <button type="button" id="salvaPagella" class="floating-pill-btn">
      <i class="fas fa-save"></i> <span id="salvaPagellaText">Salva Formazione</span>
    </button>
  </div>

  <!-- ============ Pagina 4: Allenamento ============ -->
  <div id="page-allenamento" class="page-container hidden">
    <div class="flex-control-row">
      <label for="dataAllenamento">Data</label>
      <input type="date" id="dataAllenamento" name="dataAllenamento" required />
    </div>

    <!-- Mostrato al posto della lista finche' non viene scelta una data -->
    <div class="stato-attesa">
      <i class="fas fa-calendar-day"></i>
      <span>Scegli una data per iniziare</span>
    </div>

    <form id="allenamentoForm">
      <div id="lista-giocatori"></div>

      <button type="submit" id="salvaAllenamento" class="floating-pill-btn">
        <i class="fas fa-save"></i> <span>Salva Pagella</span>
      </button>
    </form>
  </div>

  <!-- ============ Scheda giocatore ============ -->
  <div id="modal-giocatore" class="modal-overlay hidden" role="dialog" aria-modal="true"
    aria-labelledby="modal-nome">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-nome"></h3>
        <button type="button" class="modal-close" aria-label="Chiudi">
          <i class="fas fa-xmark"></i>
        </button>
      </div>
      <div id="modal-corpo"></div>
    </div>
  </div>

  <!-- ============ Navbar ============ -->
  <nav class="bottom-nav">
    <a href="#stats" class="nav-item active" data-rotta="stats">
      <i class="fas fa-chart-line"></i>
      <span>Stats</span>
    </a>
    <a href="#cronologia" class="nav-item" data-rotta="cronologia">
      <i class="fas fa-history"></i>
      <span>Cronologia</span>
    </a>
    <a href="#partita" class="nav-item" data-rotta="partita">
      <i class="fas fa-futbol"></i>
      <span>Partita</span>
    </a>
    <a href="#allenamento" class="nav-item" data-rotta="allenamento">
      <i class="fas fa-running"></i>
      <span>Allen</span>
    </a>
  </nav>

  <div id="avviso" style="display:none;" role="status" aria-live="polite"></div>

  <!-- Firebase (SDK compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // Un solo progetto Firebase per tutte le squadre: cambia solo il ramo
    // di primo livello, definito in utils.js (ID_SQUADRA).
    const firebaseConfig = {
      apiKey: "AIzaSyADt6AZ6c1E1cXp9ZY8NgJoWC4VTGXUyk0",
      authDomain: "allenamenti-motra-senior.firebaseapp.com",
      projectId: "allenamenti-motra-senior",
      storageBucket: "allenamenti-motra-senior.firebasestorage.app",
      messagingSenderId: "816511360311",
      appId: "1:816511360311:web:d50530672d926d48f0ceb2",
      measurementId: "G-M8SB7S7DQ7",
      databaseURL:
        "https://allenamenti-motra-senior-default-rtdb.europe-west1.firebasedatabase.app",
    };

    firebase.initializeApp(firebaseConfig);
    window.firebaseDB = firebase.database();
  </script>

  <!-- Logica applicativa (il routing e' in router.js, importato da index.js) -->
  <script type="module" src="index.js"></script>
  <script type="module" src="partita_spa.js"></script>
  <script type="module" src="allenamenti_spa.js"></script>
</body>

</html>
